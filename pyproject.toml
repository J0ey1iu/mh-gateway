[project]
name = "mh-gateway"
version = "0.1.1a3"
description = "Orchestration Gateway SDK — load scenarios, route agents, stream events. Built on top of minimal-harness."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "minimal-harness>=0.8.0a1",
    "mh-service-kit>=0.1.1",
    "python-multipart>=0.0.20",
] 

[build-system]
requires = ["uv_build>=0.10.12,<0.12"]
build-backend = "uv_build"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mh_gateway = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv.sources]
minimal-harness = { workspace = true }
mh-service-kit = { workspace = true }

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
